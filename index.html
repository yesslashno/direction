<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direction — Creative alignment</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c46f5'/%3E%3Ctext x='7' y='25' fill='white' font-size='25'%3ED%3C/text%3E%3C/svg%3E"><style>
:root{font:16px Arial,sans-serif;color:#171923;background:#f3f4f8}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:#e8eaf0;padding:14px 18px;color:inherit}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #8092ff;outline-offset:3px}.primary{background:#2c46f5;color:white}.quiet{background:transparent;color:#606577}header{padding:22px 5%;display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid #e0e3ec}.logo{font-weight:800;font-size:24px;letter-spacing:-1px}.logo span{color:#2c46f5}nav{display:flex;gap:8px}nav button{font-size:14px;padding:10px}main{max-width:1100px;margin:auto;padding:40px 24px}.small{font-size:14px;color:#646b80;line-height:1.6}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:700;text-transform:uppercase;color:#2c46f5}h1{font-size:clamp(32px,5vw,48px);letter-spacing:-1.5px;line-height:1.1}h2{font-size:24px;letter-spacing:-.5px}p{line-height:1.6}.welcome,.review{max-width:530px;margin:20px auto}.panel{background:white;border:1px solid #e0e3ec;border-radius:16px;padding:24px}.fields{display:grid;gap:18px;margin:28px 0}label{font-size:14px;font-weight:600}input{display:block;width:100%;border:1px solid #cdd1dd;border-radius:8px;padding:14px;margin-top:8px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.progress{height:4px;background:#dfe3ef;margin-bottom:24px}.progress span{display:block;height:100%;background:#2c46f5}.art{aspect-ratio:1.12;padding:8%;display:flex;flex-direction:column;justify-content:space-between;border-radius:12px;touch-action:pan-y;user-select:none;transition:transform .18s,opacity .18s;box-shadow:0 8px 28px #17192312}.brand{font-size:13px;font-weight:700;letter-spacing:3px}.headline{font-size:clamp(32px,6vw,58px);font-weight:800;letter-spacing:-2px;line-height:1;max-width:95%}.foot{font-size:13px}.t0{background:#e3f641;color:#1a2410}.t1{background:#153b35;color:#f2eadb}.t1 .headline{font-family:Georgia,serif;font-weight:400}.t2{background:#ec472d;color:#fff5e4}.t2 .headline{text-transform:uppercase}.t3{background:#efeef0;color:#24252a}.t3 .headline{font-weight:400}.t4{background:#2433d5;color:white}.t4 .headline{font-style:italic}.t5{background:#171923;color:#f899cd}.t5 .headline{font-family:Georgia,serif}.controls{display:flex;gap:12px;margin:20px 0}.controls button{flex:1;padding:18px 10px}.question{text-align:center;font-size:20px;font-weight:700}.hint{text-align:center;font-size:14px;color:#646b80}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 26px}.chip{border:1px solid #d9deea;background:white}.chip.on{background:#edf0ff;color:#2c46f5;border-color:#2c46f5}.follow h2{font-size:20px}.section{margin-top:36px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tile{padding:13px}.tile .headline{font-size:32px}.tile h3{font-size:16px;margin-bottom:6px}.takeaway{background:#171923;color:white;padding:30px;border-radius:16px;margin:26px 0}.takeaway .eyebrow{color:#a7b2ff}.takeaway textarea{width:100%;background:transparent;border:0;color:white;font-size:clamp(22px,3vw,30px);line-height:1.4;resize:vertical;margin-top:14px;min-height:115px}.stakeholders{display:flex;gap:10px;flex-wrap:wrap}.stakeholders label{background:white;border:1px solid #dce0eb;padding:12px 16px;border-radius:8px;display:flex;gap:10px;align-items:center}.stakeholders input{width:auto;margin:0;accent-color:#2c46f5}.split{border-left:4px solid #2c46f5}details{margin:18px 0}summary{cursor:pointer;font-weight:600}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #e0e3ec}dialog{border:0;border-radius:16px;padding:20px;width:min(90vw,800px)}dialog::backdrop{background:#171923b0}dialog .headline{font-size:clamp(40px,8vw,90px)}@media(max-width:650px){header{padding:16px}.logo{font-size:21px}nav button{font-size:13px;padding:8px}main{padding:26px 18px}.grid{grid-template-columns:1fr}.tile .art{aspect-ratio:1.5}.panel,.takeaway{padding:22px}}
.phase{max-width:740px;min-height:65vh;display:flex;flex-direction:column;justify-content:center;margin:auto}.phase h1{font-size:clamp(48px,8vw,84px);letter-spacing:-3px;max-width:720px;margin:25px 0}.phase p{max-width:460px;color:#646b80;margin-bottom:32px}.phase-next{width:76px;height:76px;border-radius:50%;font-size:38px;display:grid;place-items:center}.phase-next:hover{background:#1d34ce}@media(max-width:650px){.phase h1{letter-spacing:-2px}.phase{min-height:70vh}}</style></head><body><header><div class="logo">direction<span>.</span></div><nav><button id="clientNav">Client experience</button><button id="reportNav">Sample report</button></nav></header><main id="app"></main><dialog id="zoom"><button id="closeZoom" class="quiet">Close</button><div id="zoomContent"></div></dialog><script>
const titles=['Less noise. More life.','Made for the everyday.','Good things take guts.','Space to be yourself.','Make your next move.','A little out of the ordinary.','Fresh thinking. Daily.','Naturally, together.','Big ideas. Zero fuss.','Simply better.','Stay curious.','Why be predictable?','A brighter kind of day.','Take the long way home.','Let’s make some noise.','Consider the essentials.','Something worth starting.','Good company. Great stories.','Small changes. Big energy.','Rooted in real life.','Your day. Your rules.','Less, thoughtfully.','Ready when you are.','Serious about not being serious.'];
const tags=[['Vibrant colors','Bold typography','Simple layout'],['Restrained typography','Earnest tone','Simple layout'],['Playful tone','Bold typography','Vibrant colors'],['Minimal layout','Restrained typography','Direct tone'],['Expressive typography','Direct tone','Vibrant colors'],['Playful tone','Expressive typography','Muted colors']];const assets=titles.slice(0,12).map((title,id)=>({id,title,t:id%6,tags:tags[id%6]}));const categories=['Imagery','Colors','Typography','Layout','Words / tone','Overall feel'];let state={screen:'welcome',name:'',answers:[],follow:[],fi:0,responses:{},fit:null,reasons:[]};let included=new Set(['Alex','Jordan','Sam']);const app=document.querySelector('#app');
function art(a){return `<div class="art t${a.t}"><div class="brand">${['EVERDAY','FIELDWORK','BOLD CO.','FORM','FORWARD','ODDLY'][a.t]}</div><div class="headline">${a.title}</div><div class="foot">Sample creative · ${String(a.id+1).padStart(2,'0')}</div></div>`}
function sampleAnswer(p,a){const like=(p==='Sam'?[0,2,4]:[0,1,3]).includes(a.t);return {like,fit:like?'Yes':'No',reasons:[['Colors','Typography'],['Typography','Layout'],['Words / tone'],['Layout'],['Typography'],['Words / tone','Overall feel']][a.t]}}
function render(){if(state.screen==='welcome'){app.innerHTML=`<div class="welcome"><div class="eyebrow">Fieldwork / Creative direction</div><h1>Help us get a feel for what’s right for your brand.</h1><p>Explore ${assets.length} creative examples and give us your first reaction. We’ll use your responses alongside the brief to shape the creative direction.</p><form id="start"><div class="fields"><label>Your name<input id="name" required maxlength="80" autocomplete="name" placeholder="Alex Morgan"></label><label>Role <span class="small">(optional)</span><input id="role" maxlength="100" placeholder="Founder, marketing lead…"></label></div><button class="primary">Start exploring</button></form><p class="small">Prototype · Sample creative layouts · Answers stay in this tab</p></div>`;document.querySelector('#start').onsubmit=e=>{e.preventDefault();state.name=document.querySelector('#name').value.trim();if(!state.name)return;state.role=document.querySelector('#role').value.trim();state.screen='gutIntro';render()};return}
if(state.screen==='gutIntro'||state.screen==='closerIntro'){const first=state.screen==='gutIntro';app.innerHTML=`<section class="phase"><div class="eyebrow">Step ${first?'1':'2'} of 2</div><h1>${first?'First, let’s get your gut reactions.':'Now, let’s take a closer look.'}</h1><p>${first?'Swipe through '+assets.length+' examples. Go with your first instinct.':'We’ll revisit '+state.follow.length+' examples to see what feels right for your brand and what stood out.'}</p><button class="phase-next primary" id="phaseNext" aria-label="${first?'Begin gut reactions':'Begin closer look'}"><span aria-hidden="true">→</span></button></section>`;document.querySelector('#phaseNext').onclick=()=>{state.screen=first?'swipe':'follow';render();window.scrollTo(0,0)};return}
if(state.screen==='swipe'){const i=state.answers.length,a=assets[i];app.innerHTML=`<div class="review"><div class="top"><span class="eyebrow">Your first reaction</span><span class="small">${i+1} of ${assets.length}</span></div><div class="progress"><span style="width:${i/assets.length*100}%"></span></div>${art(a)}<div class="top"><button class="quiet" id="undo" ${i?'':'disabled'}>Undo</button><button class="quiet" id="enlarge">Enlarge</button></div><p class="question">Does this appeal to you?</p><div class="controls"><button id="no">Not for me</button><button class="primary" id="yes">Appeals to me</button></div><p class="hint">Swipe left for no · Swipe right for yes<br>Keyboard: left and right keys</p></div>`;document.querySelector('#no').onclick=()=>swipe(false);document.querySelector('#yes').onclick=()=>swipe(true);document.querySelector('#undo').onclick=()=>{state.answers.pop();render()};document.querySelector('#enlarge').onclick=()=>enlarge(a);const card=document.querySelector('.art');let start=null;card.onpointerdown=e=>{start={x:e.clientX,y:e.clientY};card.setPointerCapture(e.pointerId)};card.onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)swipe(dx>0)};card.onpointercancel=()=>start=null;return}
if(state.screen==='follow'){const a=assets[state.follow[state.fi]],liked=state.answers[a.id];app.innerHTML=`<div class="review"><div class="top"><span class="eyebrow">A closer look</span><span class="small">${state.fi+1} of ${state.follow.length}</span></div>${art(a)}<div class="top"><span class="small">You chose: ${liked?'Appeals to me':'Not for me'}</span><button class="quiet" id="enlarge">Enlarge</button></div><div class="follow"><h2>Does this feel right for your brand?</h2><p class="small">Fieldwork aims to feel approachable, credible, and energetic.</p><div class="chips">${['No','Not sure','Yes'].map(x=>`<button class="chip ${state.fit===x?'on':''}" data-fit="${x}" aria-pressed="${state.fit===x}">${x}</button>`).join('')}</div><h2>What ${liked?'did':'didn’t'} you like about this?</h2><p class="small">Pick any that apply. You can leave this blank.</p><div class="chips">${categories.map(x=>`<button class="chip ${state.reasons.includes(x)?'on':''}" data-reason="${x}" aria-pressed="${state.reasons.includes(x)}">${x}</button>`).join('')}</div><button class="primary" id="next" ${state.fit?'':'disabled'}>${state.fi+1===state.follow.length?'Finish':'Next'}</button> <button class="quiet" id="skip">Skip this asset</button></div></div>`;document.querySelector('#enlarge').onclick=()=>enlarge(a);document.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{state.fit=b.dataset.fit;render()});document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{const x=b.dataset.reason;state.reasons=state.reasons.includes(x)?state.reasons.filter(y=>y!==x):[...state.reasons,x];render()});document.querySelector('#next').onclick=()=>nextFollow(false);document.querySelector('#skip').onclick=()=>nextFollow(true);return}
if(state.screen==='done'){app.innerHTML=`<div class="welcome panel"><div class="eyebrow">All done</div><h1>Thanks, <span id="thanks"></span>.</h1><p>Your responses are complete. We’ll use them alongside your brief to help shape the creative direction.</p><p class="small">This prototype holds your answers while this tab is open. The report uses fictional stakeholder responses.</p><button class="primary" id="viewReport">Explore the sample report</button></div>`;document.querySelector('#thanks').textContent=state.name;document.querySelector('#viewReport').onclick=()=>{state.screen='report';render()};return}renderReport()}
let busy=false;function swipe(like){if(busy||state.screen!=='swipe')return;busy=true;const el=document.querySelector('.art');el.style.transform=`translateX(${like?90:-90}px) rotate(${like?8:-8}deg)`;el.style.opacity=0;setTimeout(()=>{state.answers.push(like);if(state.answers.length===assets.length){const positive=assets.filter(a=>state.answers[a.id]).map(a=>a.id),negative=assets.filter(a=>!state.answers[a.id]).map(a=>a.id);state.follow=[...positive.slice(0,3),...negative.slice(0,3)];state.follow=[...state.follow,...assets.map(a=>a.id).filter(id=>!state.follow.includes(id))].slice(0,6);state.screen='closerIntro'}busy=false;render()},180)}
function nextFollow(skip){state.responses[state.follow[state.fi]]={fit:skip?null:state.fit,reasons:skip?[]:[...state.reasons]};state.fi++;state.fit=null;state.reasons=[];if(state.fi===state.follow.length)state.screen='done';render()}
function enlarge(a){document.querySelector('#zoomContent').innerHTML=art(a);document.querySelector('#zoom').showModal()}document.querySelector('#closeZoom').onclick=()=>document.querySelector('#zoom').close();
function renderReport(){const people=[...included],n=people.length,scored=assets.slice(0,6).map(a=>({a,yes:people.filter(p=>sampleAnswer(p,a).like),no:people.filter(p=>!sampleAnswer(p,a).like)}));const takeaway=!n?'Select at least one stakeholder to see a combined direction.':people.every(p=>p==='Sam')?'Sam prefers bold, energetic creative with expressive typography and playful language.':included.has('Sam')&&n>1?'The team shares an appetite for bold color, with disagreement about how playful and expressive the work should feel.':'The team prefers straightforward layouts and restrained typography, with room for bold color.';function tile(x,pos){const voters=pos?x.yes:x.no,reasons=[...new Set(voters.flatMap(p=>sampleAnswer(p,x.a).reasons))];return `<article class="tile panel">${art(x.a)}<h3>${voters.length} of ${n} · ${pos?'Like + fits':'Dislike + doesn’t fit'}</h3><p class="small">${reasons.join(' · ')}</p><details><summary>View responses</summary>${people.map(p=>{const r=sampleAnswer(p,x.a);return `<p class="small"><strong>${p}</strong>: ${r.like?'Like / fits':'Dislike / doesn’t fit'}<br>${r.reasons.join(', ')}</p>`}).join('')}</details></article>`}
app.innerHTML=`<div class="eyebrow">Internal / Fictional sample report</div><h1>Fieldwork</h1><p class="small">Creative direction · 3 stakeholders · ${assets.length} assets reviewed</p><div class="stakeholders">${['Alex','Jordan','Sam'].map(p=>`<label><input type="checkbox" data-person="${p}" ${included.has(p)?'checked':''}>${p}<span class="small">${p==='Alex'?'Founder':p==='Jordan'?'Marketing':'Sales'}</span></label>`).join('')}</div><p class="small">${n?`Based on ${people.join(', ')} · ${n} of 3 stakeholders included`:'No stakeholders included'}</p><div class="takeaway"><div class="eyebrow">Quick takeaway</div><textarea aria-label="Editable quick takeaway">${takeaway}</textarea><p class="small" style="color:#aeb5ca">Editable interpretation · Resets when stakeholder selection changes</p></div><section class="section"><h2>Shared positive references</h2><p class="small">A majority like these and feel they fit the brand.</p><div class="grid">${n?scored.filter(x=>x.yes.length>n/2).sort((a,b)=>b.yes.length-a.yes.length).map(x=>tile(x,true)).join(''):'<p>Select stakeholders to see references.</p>'}</div></section><section class="section"><h2>Shared boundaries</h2><p class="small">A majority dislike these and feel they don’t fit the brand.</p><div class="grid">${n?scored.filter(x=>x.no.length>n/2).sort((a,b)=>b.no.length-a.no.length).map(x=>tile(x,false)).join(''):'<p>Select stakeholders to see boundaries.</p>'}</div></section><section class="section"><h2>Differences to discuss</h2><div class="panel split">${included.has('Sam')&&n>1?`<strong>How playful should the brand feel?</strong><p>Sam supports expressive typography and playful headlines. ${people.filter(p=>p!=='Sam').join(' and ')} favor more restrained examples.</p><p class="small">Compare references 03 and 05 with 02 and 04.</p>`:`<p>${n?'No disagreements in these sample responses.':'Select stakeholders to compare responses.'}</p>`}</div></section><section class="section"><details><summary>All sample responses / Individual views</summary><p class="small">Select only one stakeholder above to view their profile. All ${assets.length} swipes are shown below; brand fit and reasons were collected only for references 01–06 in this sample.</p><div class="scroll"><table><thead><tr><th>Reference</th>${people.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>${assets.map(a=>`<tr><td>${String(a.id+1).padStart(2,'0')} · ${a.title}</td>${people.map(p=>{const r=sampleAnswer(p,a);return `<td>${r.like?'Like':'Dislike'}${a.id<6?` / ${r.fit==='Yes'?'Fits':'Doesn’t fit'}`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></details><details><summary>Asset tags and interpretation</summary><p class="small">Client selections identify categories; asset tags describe specific creative qualities. This takeaway is an illustrative interpretation, not an automated assessment.</p>${assets.slice(0,6).map(a=>`<p class="small"><strong>${String(a.id+1).padStart(2,'0')}</strong> · ${a.tags.join(' · ')}</p>`).join('')}</details></section>`;document.querySelectorAll('[data-person]').forEach(el=>el.onchange=()=>{el.checked?included.add(el.dataset.person):included.delete(el.dataset.person);render()})}
document.querySelector('#reportNav').onclick=()=>{state.screen='report';render()};document.querySelector('#clientNav').onclick=()=>{state.screen=state.answers.length===assets.length?(state.fi===state.follow.length?'done':state.screen==='closerIntro'?'closerIntro':'follow'):state.name?(state.screen==='gutIntro'?'gutIntro':'swipe'):'welcome';render()};document.addEventListener('keydown',e=>{if(state.screen==='swipe'&&!document.querySelector('#zoom').open){if(e.key==='ArrowLeft')swipe(false);if(e.key==='ArrowRight')swipe(true)}});
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'set_report_stakeholders',description:'Choose fictional stakeholders contributing to the sample report.',inputSchema:{type:'object',properties:{names:{type:'array',items:{type:'string',enum:['Alex','Jordan','Sam']},uniqueItems:true}},required:['names'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!Array.isArray(input.names)||input.names.some(n=>!['Alex','Jordan','Sam'].includes(n)))throw new Error('Invalid stakeholders');included=new Set(input.names);state.screen='report';render();return {included:[...included]}}})}catch(e){console.warn('Report tool unavailable')}}render();
</script></body></html>
